name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package.json

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build

      - name: Upload WebUI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          if-no-files-found: error

  # --- Windows 构建：优先放置且 x86_64 优先编译发布 ---
  build-windows:
    needs: [build-webui]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows targets (x86_64 first)
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 Windows x86_64
      - name: Build Windows x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Windows x86_64 binary
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-x64.exe

      - name: Release Windows x86_64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 次级编译 Windows ARM64
      - name: Build Windows ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Prepare Windows ARM64 binary
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-arm64.exe

      - name: Release Windows ARM64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Linux 构建：x86_64 优先编译发布 ---
  build-linux:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools
        run: |
          pip install cargo-zigbuild ziglang

      - name: Add Linux targets (x86_64 first)
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 Linux x86_64
      - name: Build Linux x86_64
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl

      - name: Prepare and Strip Linux x86_64 binary
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-x64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-x64 || true

      - name: Release Linux x86_64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 次级编译 Linux ARM64
      - name: Build Linux ARM64
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Prepare and Strip Linux ARM64 binary
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-arm64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-arm64 || true

      - name: Release Linux ARM64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- macOS 构建：x86_64 优先编译发布 ---
  build-macos:
    needs: [build-webui]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (x86_64 first)
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      # 自动从 Git Tag 注入版本号到 Cargo.toml（兼容 macOS BSD sed）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 macOS x86_64 (Intel)
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Prepare and Strip macOS x86_64 binary
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-x64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-x64 || true

      - name: Release macOS x86_64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-darwin-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 次级编译 macOS ARM64 (Apple Silicon)
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare and Strip macOS ARM64 binary
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-arm64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-arm64 || true

      - name: Release macOS ARM64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distro-pm-check:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with distro-pm feature
        run: cargo build -p jeikcode --features distro-pm

      - name: Test distro-pm gating
        run: cargo test -p jeikcode-updater --lib --features distro-pm

  # --- 自动化收尾：自动提取 6 平台真实 SHA256/文件大小并更新 latest.json ---
  update-manifest:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch release assets and calculate real sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Updating latest.json for release $TAG_NAME in $REPO ..."
          node -e "
          const fs = require('fs');
          const https = require('https');
          const crypto = require('crypto');

          const tag = process.env.TAG_NAME;
          const repo = process.env.REPO;
          const token = process.env.GITHUB_TOKEN;

          async function fetchRelease() {
            const url = 'https://api.github.com/repos/' + repo + '/releases/tags/' + tag;
            const options = {
              headers: {
                'User-Agent': 'JeikCode-Release-Bot',
                'Authorization': 'token ' + token,
                'Accept': 'application/vnd.github+json'
              }
            };
            return new Promise((resolve, reject) => {
              https.get(url, options, res => {
                let body = '';
                res.on('data', d => body += d);
                res.on('end', () => {
                  try { resolve(JSON.parse(body)); }
                  catch (e) { reject(new Error('Failed to parse release response: ' + body)); }
                });
              }).on('error', reject);
            });
          }

          async function downloadAndHash(url) {
            return new Promise((resolve, reject) => {
              function follow(targetUrl) {
                https.get(targetUrl, { headers: { 'User-Agent': 'JeikCode-Release-Bot' } }, res => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    return follow(res.headers.location);
                  }
                  if (res.statusCode !== 200) {
                    return reject(new Error('HTTP ' + res.statusCode + ' downloading ' + targetUrl));
                  }
                  const hash = crypto.createHash('sha256');
                  let size = 0;
                  res.on('data', chunk => {
                    hash.update(chunk);
                    size += chunk.length;
                  });
                  res.on('end', () => resolve({ sha256: hash.digest('hex'), size }));
                }).on('error', reject);
              }
              follow(url);
            });
          }

          async function run() {
            const release = await fetchRelease();
            if (!release.assets || release.assets.length === 0) {
              console.error('No assets found in release:', release);
              process.exit(1);
            }
            const binaries = {};
            for (const asset of release.assets) {
              let target = null;
              if (asset.name === 'jeikcode-' + tag + '-windows-x64.exe') target = 'windows-x64';
              else if (asset.name === 'jeikcode-' + tag + '-windows-arm64.exe') target = 'windows-arm64';
              else if (asset.name === 'jeikcode-' + tag + '-linux-x64') target = 'linux-x64';
              else if (asset.name === 'jeikcode-' + tag + '-linux-arm64') target = 'linux-arm64';
              else if (asset.name === 'jeikcode-' + tag + '-darwin-x64') target = 'darwin-x64';
              else if (asset.name === 'jeikcode-' + tag + '-darwin-arm64') target = 'darwin-arm64';

              if (target) {
                console.log('Fetching & hashing ' + asset.name + ' (' + target + ') ...');
                const info = await downloadAndHash(asset.browser_download_url);
                binaries[target] = info;
                console.log('  -> ' + target + ': ' + info.size + ' bytes, sha256: ' + info.sha256);
              }
            }

            if (Object.keys(binaries).length === 0) {
              console.error('No recognized target binaries found');
              process.exit(1);
            }

            const manifest = {
              version: tag,
              released_at: new Date().toISOString().slice(0, 10),
              binaries: binaries
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('latest.json successfully generated with ' + Object.keys(binaries).length + ' targets.');

            // 自动同步仓库所有版本号元数据
            const cleanVersion = tag.replace(/^v/, '');
            if (fs.existsSync('Cargo.toml')) {
              let c = fs.readFileSync('Cargo.toml', 'utf8');
              c = c.replace(/^version = ".*"/m, `version = "${cleanVersion}"`);
              fs.writeFileSync('Cargo.toml', c);
              console.log('Cargo.toml version updated to ' + cleanVersion);
            }

            if (fs.existsSync('scripts/install.ps1')) {
              let c = fs.readFileSync('scripts/install.ps1', 'utf8');
              c = c.replace(/\$DefaultVersion = ".*"/, `$DefaultVersion = "${tag}"`);
              fs.writeFileSync('scripts/install.ps1', c);
              console.log('scripts/install.ps1 DefaultVersion updated to ' + tag);
            }
            if (fs.existsSync('scripts/install.sh')) {
              let c = fs.readFileSync('scripts/install.sh', 'utf8');
              c = c.replace(/DEFAULT_VERSION=".*"/, `DEFAULT_VERSION="${tag}"`);
              fs.writeFileSync('scripts/install.sh', c);
              console.log('scripts/install.sh DEFAULT_VERSION updated to ' + tag);
            }

            for (const file of ['README.md', 'README.zh-CN.md', 'README.en.md']) {
              if (fs.existsSync(file)) {
                let c = fs.readFileSync(file, 'utf8');
                c = c.replace(/badge\/version-[0-9a-zA-Z.-]+-blue\.svg/g, `badge/version-${cleanVersion}-blue.svg`);
                c = c.replace(/badge\/Releases-v?[0-9a-zA-Z.-]+-00f2fe/g, `badge/Releases-${tag}-00f2fe`);
                fs.writeFileSync(file, c);
                console.log(file + ' version badges updated.');
              }
            }
          }

          run().catch(err => {
            console.error('Fatal error:', err);
            process.exit(1);
          });
          "

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        run: |
          cargo generate-lockfile

      - name: Commit and push all updated release files to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README*.md scripts/install.* latest.json
          git diff --staged --quiet || (git commit -m "chore(release): 自动同步 ${{ github.ref_name }} 版本号与 SHA256 校验清单 [skip ci]" && git push origin main)
