name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 自动抢占与防重：全局只允许最新的发版流水线独占运行，新提交自动取消所有旧的/排队中的流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'release' }}
  cancel-in-progress: true

jobs:
  # --- 前置门禁：严格检查当前版本是否大于上一个发布版本，不大于则直接终止流水线 ---
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/check-version-gate.js "$TAG_NAME" "$REPO"

  build-webui:
    needs: [check-version]
    if: |
      always() &&
      (needs.check-version.result == 'success' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package.json

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build

      - name: Upload WebUI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          if-no-files-found: error

  # --- Windows 构建：优先放置且 x86_64 优先编译发布 ---
  build-windows:
    needs: [build-webui]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows targets (x86_64 first)
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 Windows x86_64
      - name: Build Windows x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Windows x86_64 binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-x64.exe

      - name: Release Windows x86_64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 次级编译 Windows ARM64
      - name: Build Windows ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Prepare Windows ARM64 binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-arm64.exe

      - name: Release Windows ARM64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 立即更新 Windows 平台版本与 latest.json 校验清单（无需等待其他平台！）
      - name: Update Windows platform manifest immediately
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          node scripts/update-platform-manifest.js "$TAG_NAME" \
            "windows-x64:dist/jeikcode-${TAG_NAME}-windows-x64.exe" \
            "windows-arm64:dist/jeikcode-${TAG_NAME}-windows-arm64.exe"

  # --- Linux 构建：x86_64 优先编译发布 ---
  build-linux:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools
        run: |
          pip install cargo-zigbuild ziglang

      - name: Add Linux targets (x86_64 first)
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 Linux x86_64
      - name: Build Linux x86_64
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl

      - name: Prepare and Strip Linux x86_64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-x64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-x64 || true

      - name: Release Linux x86_64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 次级编译 Linux ARM64
      - name: Build Linux ARM64
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Prepare and Strip Linux ARM64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-arm64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-arm64 || true

      - name: Release Linux ARM64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 立即更新 Linux 平台版本与 latest.json 校验清单（无需等待其他平台！）
      - name: Update Linux platform manifest immediately
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          node scripts/update-platform-manifest.js "$TAG_NAME" \
            "linux-x64:dist/jeikcode-${TAG_NAME}-linux-x64" \
            "linux-arm64:dist/jeikcode-${TAG_NAME}-linux-arm64"

  # --- macOS 构建：x86_64 优先编译发布 ---
  build-macos:
    needs: [build-webui]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (x86_64 first)
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      # 自动从 Git Tag 注入版本号到 Cargo.toml（兼容 macOS BSD sed）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 macOS x86_64 (Intel)
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Prepare and Strip macOS x86_64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-x64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-x64 || true

      - name: Release macOS x86_64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-darwin-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 次级编译 macOS ARM64 (Apple Silicon)
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare and Strip macOS ARM64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-arm64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-arm64 || true

      - name: Release macOS ARM64 Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jeikcode-*-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 立即更新 macOS 平台版本与 latest.json 校验清单（无需等待其他平台！）
      - name: Update macOS platform manifest immediately
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          node scripts/update-platform-manifest.js "$TAG_NAME" \
            "darwin-x64:dist/jeikcode-${TAG_NAME}-darwin-x64" \
            "darwin-arm64:dist/jeikcode-${TAG_NAME}-darwin-arm64"

  # --- Linux distro-pm 包管理工具兼容性测试门禁 ---
  distro-pm-check:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with distro-pm feature
        run: cargo build -p jeikcode --features distro-pm

      - name: Test distro-pm gating
        run: cargo test -p jeikcode-updater --lib --features distro-pm
